name: Build Mod Workflow
description: This workflow builds a RimWorld mod and prepares it for release, including uploading to GitHub artifacts.

on:
    workflow_call:
        inputs:
            mod_name:
                type: "string"
                description: "Name of the mod (used for solution and artifact names)"
                required: true
            rw_versions:
                type: "string"
                description: "Deprecated and ignored; the versions to build for are read from About/About.xml's <supportedVersions>"
                required: false
            artifact_suffix:
                required: true
                description: "Suffix for the artifact name (e.g., 'Release' or '$ {{ github.sha }}')"
                type: string
            solution_configuration:
                type: "string"
                description: "Solution configuration to build"
                default: "Release"
                required: false
            license_files:
                type: "string"
                description: "List of license files to include in the artifact, separated by space (e.g., 'LICENSE.txt LICENSE.md')"
                default: "LICENSE"
                required: false
            extra_files:
                type: "string"
                description: "List of extra files to include in the artifact, separated by space (e.g., 'README.md CHANGELOG.md')"
                default: ""
                required: false
            project_dependencies_base_path:
                type: "string"
                description: "Base path for project dependencies, used to resolve paths to project dependencies in the project files"
                default: "..\\..\\.."
                required: false
            steam_workshop_folder_path:
                type: "string"
                description: "Base path for the Steam Workshop folder, used to resolve paths to the Steam Workshop folder in the project files"
                default: "..\\..\\.deps\\refs"
                required: false
            bake_asset_packs:
                type: boolean
                description: "Bake the Assets.zip packs RimWorld 1.7+ loads textures and sounds from, when About/About.xml supports 1.7 or later"
                default: true
                required: false
        outputs:
            artifact_name:
                description: "Name of the artifact uploaded"
                value: ${{ inputs.mod_name }}-${{ inputs.artifact_suffix }}

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Warn About Deprecated rw_versions Input
              if: ${{ inputs.rw_versions != '' }}
              shell: bash
              run: echo "::warning title=Deprecated Input::The rw_versions input is deprecated and ignored; the versions to build for are read from About/About.xml's <supportedVersions>. Remove rw_versions from the calling workflow."

            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Checkout rimworld-utils Repository
              uses: actions/checkout@v7
              with:
                  repository: "ilyvion/rimworld-utils"
                  path: "rimworld-utils"

            - name: Move to parent, where it's expected
              shell: bash
              run: mv rimworld-utils ..

            - name: Read Supported Versions
              id: supported_versions
              shell: bash
              run: |
                  versions=$(python3 - <<'PY'
                  import xml.etree.ElementTree as ET

                  root = ET.parse("About/About.xml").getroot()
                  for li in root.findall("./supportedVersions/li"):
                      if li.text and li.text.strip():
                          print(li.text.strip())
                  PY
                  )

                  if [ -z "$versions" ]; then
                    echo "::error file=About/About.xml,title=No Supported Versions::About/About.xml has no <supportedVersions> entries."
                    exit 1
                  fi

                  versions=$(sort -V <<< "$versions")
                  echo "Supported RimWorld versions: $(tr '\n' ' ' <<< "$versions")"
                  {
                    echo "versions<<EOF"
                    echo "$versions"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

                  # Asset packs exist from RimWorld 1.7 on.
                  newest=$(tail -n 1 <<< "$versions")
                  if [ "$(printf '%s\n' 1.7 "$newest" | sort -V | head -n 1)" = "1.7" ]; then
                    echo "has_asset_packs=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "has_asset_packs=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Post-Checkout Repository Hook
              uses: ./.github/build_hooks/post_checkout_hook
              if: ${{ hashFiles('./.github/build_hooks/post_checkout_hook/action.yml') != '' }}

            - name: Pre-Setup Dotnet Hook
              uses: ./.github/build_hooks/pre_setup_dotnet_hook
              if: ${{ hashFiles('./.github/build_hooks/pre_setup_dotnet_hook/action.yml') != '' }}

            - name: Setup Dotnet
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: 10.0.x

            # Asks MSBuild which projects the solution builds with UseLaboratory, for every
            # supported version, and where their ilyvion.Laboratory project reference points.
            - name: Find ilyvion.Laboratory Location
              id: laboratory
              shell: bash
              run: |
                  references_file=$(mktemp)
                  mapfile -t rw_versions <<< "${{ steps.supported_versions.outputs.versions }}"
                  for rw_version in "${rw_versions[@]}"; do
                    dotnet msbuild \
                    -nologo \
                    -verbosity:quiet \
                    -target:ReportLaboratoryReferences \
                    --property "CustomAfterMicrosoftCommonTargets=$(realpath ../rimworld-utils/LaboratoryReferences.targets)" \
                    --property "LaboratoryReferencesFile=$references_file" \
                    --property "RimWorldVersion=$rw_version"\
                    --property "ProjectDependenciesBasePath=${{ inputs.project_dependencies_base_path }}"\
                    --property "RimWorldSteamWorkshopFolderPath=${{ inputs.steam_workshop_folder_path }}"\
                    --property "Configuration=${{ inputs.solution_configuration }}" \
                    "${{ inputs.mod_name }}.sln"
                  done

                  # <repo>/Source/ilyvion.Laboratory/ilyvion.Laboratory.csproj -> <repo>
                  locations=$(sort -u "$references_file" | while read -r reference; do
                    if [ ! -e "$reference" ]; then
                      dirname "$(dirname "$(dirname "$reference")")"
                    fi
                  done | sort -u)

                  if [ -z "$locations" ]; then
                    echo "No missing ilyvion.Laboratory references; skipping its checkout."
                    exit 0
                  fi
                  if [ "$(wc -l <<< "$locations")" -gt 1 ]; then
                    echo "::error title=Conflicting ilyvion.Laboratory Locations::Projects expect ilyvion.Laboratory in more than one location: $(tr '\n' ' ' <<< "$locations")"
                    exit 1
                  fi

                  echo "ilyvion.Laboratory is expected at $locations"
                  echo "path=$locations" >> "$GITHUB_OUTPUT"

            - name: Checkout ilyvion.Laboratory Repository
              if: ${{ steps.laboratory.outputs.path != '' }}
              uses: actions/checkout@v7
              with:
                  repository: "ilyvion/ilyvion-laboratory"
                  path: "ilyvion.Laboratory"

            - name: Move ilyvion.Laboratory to where it's expected
              if: ${{ steps.laboratory.outputs.path != '' }}
              shell: bash
              env:
                  LABORATORY_PATH: ${{ steps.laboratory.outputs.path }}
              run: |
                  mkdir -p "$(dirname "$LABORATORY_PATH")"
                  mv ilyvion.Laboratory "$LABORATORY_PATH"

            - name: Post-Setup Dotnet Hook
              uses: ./.github/build_hooks/post_setup_dotnet_hook
              if: ${{ hashFiles('./.github/build_hooks/post_setup_dotnet_hook/action.yml') != '' }}

            - name: Pre-Build Mod Hook
              uses: ./.github/build_hooks/pre_build_mod_hook
              if: ${{ hashFiles('./.github/build_hooks/pre_build_mod_hook/action.yml') != '' }}

            - name: Build Mod
              shell: bash
              run: |
                  mapfile -t rw_versions <<< "${{ steps.supported_versions.outputs.versions }}"
                  for rw_version in "${rw_versions[@]}"; do
                    echo "Building for RimWorld version: $rw_version"
                    dotnet build \
                    --property "RimWorldVersion=$rw_version"\
                    --property "ProjectDependenciesBasePath=${{ inputs.project_dependencies_base_path }}"\
                    --property "RimWorldSteamWorkshopFolderPath=${{ inputs.steam_workshop_folder_path }}"\
                    --configuration "${{ inputs.solution_configuration }}" \
                    "${{ inputs.mod_name }}.sln"
                  done

            - name: Post-Build Mod Hook
              uses: ./.github/build_hooks/post_build_mod_hook
              if: ${{ hashFiles('./.github/build_hooks/post_build_mod_hook/action.yml') != '' }}

            - name: Pre-Bake Asset Packs Hook
              uses: ./.github/build_hooks/pre_bake_asset_packs_hook
              if: ${{ inputs.bake_asset_packs && steps.supported_versions.outputs.has_asset_packs == 'true' && hashFiles('./.github/build_hooks/pre_bake_asset_packs_hook/action.yml') != '' }}

            # Writes Assets.zip into every 1.7+ load folder that has Textures/ or Sounds/, as the
            # game's -BakeModAssetPacks option and Workshop upload do.
            - name: Bake Asset Packs
              if: ${{ inputs.bake_asset_packs && steps.supported_versions.outputs.has_asset_packs == 'true' }}
              shell: bash
              run: dotnet run --project ../rimworld-utils/AssetPackBaker/AssetPackBaker.csproj --configuration Release -- .

            - name: Post-Bake Asset Packs Hook
              uses: ./.github/build_hooks/post_bake_asset_packs_hook
              if: ${{ inputs.bake_asset_packs && steps.supported_versions.outputs.has_asset_packs == 'true' && hashFiles('./.github/build_hooks/post_bake_asset_packs_hook/action.yml') != '' }}

            - name: Pre-Generate Versions Directory List Hook
              uses: ./.github/build_hooks/pre_generate_versions_directory_list_hook
              if: ${{ hashFiles('./.github/build_hooks/pre_generate_versions_directory_list_hook/action.yml') != '' }}

            - name: Generate versions directory list
              id: directory_list
              shell: bash
              run: |
                  mapfile -t rw_versions <<< "${{ steps.supported_versions.outputs.versions }}"
                  {
                    echo "mod_folders<<EOF"
                    printf "%s\n" "${rw_versions[@]}"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Post-Generate Versions Directory List Hook
              uses: ./.github/build_hooks/post_generate_versions_directory_list_hook
              if: ${{ hashFiles('./.github/build_hooks/post_generate_versions_directory_list_hook/action.yml') != '' }}

            - name: Pre-Upload Mod Artifacts Hook
              uses: ./.github/build_hooks/pre_upload_mod_artifacts_hook
              if: ${{ hashFiles('./.github/build_hooks/pre_upload_mod_artifacts_hook/action.yml') != '' }}

            - name: Upload Mod Artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ inputs.mod_name }}-${{ inputs.artifact_suffix }}
                  path: |
                      ${{ inputs.extra_files }}
                      About/
                      Common/
                      ${{ steps.directory_list.outputs.mod_folders }}
                      ${{ inputs.license_files }}
                      README.md
                      CHANGELOG.md
                      LoadFolders.xml
                      !**/.*
                      !**/Assets.zip.*
                      !About/*.pdn
                      !About/*.svg
                      !About/*.ttf

            - name: Post-Upload Mod Artifacts Hook
              uses: ./.github/build_hooks/post_upload_mod_artifacts_hook
              if: ${{ hashFiles('./.github/build_hooks/post_upload_mod_artifacts_hook/action.yml') != '' }}
