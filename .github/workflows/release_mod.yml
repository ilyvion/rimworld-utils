name: Release Mod Workflow
description: >
    This workflow builds a RimWorld mod and prepares it for release, including creating a
    GitHub release and uploading the mod to the Steam Workshop.

on:
    workflow_call:
        inputs:
            artifact_name:
                type: "string"
                description: "Name of the artifact uploaded in the build step"
                required: true
            mod_name:
                type: "string"
                description: "Name of the mod (used for solution and artifact names)"
                required: true
            rw_versions:
                type: "string"
                description: "Deprecated and ignored; the supported versions are read from About/About.xml's <supportedVersions>"
                required: false
            solution_configuration:
                type: "string"
                description: "Solution configuration to build"
                default: "Release"
                required: false
            create_release:
                type: "boolean"
                description: "Whether to create a GitHub release"
                default: true
                required: false
            upload_to_steam:
                type: "boolean"
                description: "Whether to upload the mod to Steam Workshop"
                default: true
                required: false

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Warn About Deprecated rw_versions Input
              if: ${{ inputs.rw_versions != '' }}
              shell: bash
              run: echo "::warning title=Deprecated Input::The rw_versions input is deprecated and ignored; the supported versions are read from About/About.xml's <supportedVersions>. Remove rw_versions from the calling workflow."

            - name: Generate Variables
              id: variables
              shell: bash
              run: |
                  echo "mod_path=./${{ inputs.mod_name }}" >> $GITHUB_OUTPUT
                  echo "version=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
                  echo "no_prefix_version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

            - name: Checkout Repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Check Steam Description for Changes Since Last Release
              id: steam_description
              shell: bash
              env:
                  CURRENT_TAG: ${{ steps.variables.outputs.version }}
                  UPLOAD_TO_STEAM: ${{ inputs.upload_to_steam }}
              run: |
                  echo "changed=false" >> "$GITHUB_OUTPUT"

                  if [ ! -f "SteamDescription.txt" ]; then
                    echo "::warning file=SteamDescription.txt,title=Steam Description Missing::No SteamDescription.txt found in the repository root."
                    exit 0
                  fi

                  previous_tag=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)

                  # A first release counts as changed, since the Steam Workshop description may not match the file yet.
                  if [ -z "$previous_tag" ]; then
                    reason="this is the first release"
                  elif ! git diff --quiet "$previous_tag" "$CURRENT_TAG" -- SteamDescription.txt; then
                    reason="SteamDescription.txt has changed since the last release ($previous_tag)"
                  else
                    exit 0
                  fi

                  echo "changed=true" >> "$GITHUB_OUTPUT"
                  if [ "$UPLOAD_TO_STEAM" = "true" ]; then
                    echo "::notice file=SteamDescription.txt,title=Steam Description Changed::${reason^}. The Steam Workshop description will be updated after the upload."
                  else
                    echo "::notice file=SteamDescription.txt,title=Steam Description Changed::${reason^}. Remember to update the Steam Workshop description after this release."
                  fi

            - name: Verify Release Tag Is Signed
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG_NAME: ${{ steps.variables.outputs.version }}
              run: |
                  ref_json=$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG_NAME")
                  object_type=$(echo "$ref_json" | jq -r '.object.type')
                  object_sha=$(echo "$ref_json" | jq -r '.object.sha')

                  if [ "$object_type" != "tag" ]; then
                    echo "::error::Tag '$TAG_NAME' is a lightweight tag (not annotated), so it cannot be signed. Releases must be created from a signed tag."
                    exit 1
                  fi

                  tag_json=$(gh api "repos/${{ github.repository }}/git/tags/$object_sha")
                  verified=$(echo "$tag_json" | jq -r '.verification.verified')

                  if [ "$verified" != "true" ]; then
                    reason=$(echo "$tag_json" | jq -r '.verification.reason')
                    echo "::error::Tag '$TAG_NAME' is not signed or its signature could not be verified (reason: $reason)."
                    exit 1
                  fi

                  echo "Tag '$TAG_NAME' signature verified."

            - name: Create Mod Folder
              shell: bash
              run: mkdir -p ${{ steps.variables.outputs.mod_path }}

            - name: Download Mod Artifacts from Build Step
              uses: actions/download-artifact@v8
              with:
                  name: ${{ inputs.artifact_name }}
                  path: ${{ steps.variables.outputs.mod_path }}

            # We do this step to avoid a "zip bomb" as the zip from the build step
            # has the mod files at the root level, which is not what users generally want.
            - name: Zip Mod
              shell: bash
              run: zip -r ${{ steps.variables.outputs.mod_path }}.zip ${{ steps.variables.outputs.mod_path }}/*

            - name: Get Changelog Entry
              id: changelog_reader
              uses: mindsers/changelog-reader-action@v2
              with:
                  version: ${{ steps.variables.outputs.no_prefix_version }}
                  path: ${{ steps.variables.outputs.mod_path }}/CHANGELOG.md

            - name: Add Release Notes to Job Summary
              shell: bash
              env:
                  CHANGELOG_CONTENT: ${{ steps.changelog_reader.outputs.changes }}
                  VERSION: ${{ steps.variables.outputs.version }}
              run: |
                  # Discord has a 2000-character-per-message limit, so the release notes are
                  # greedily packed into chunks that stay under that limit, separated by "---".
                  # Each chunk can then be pasted as a separate Discord message.
                  discord_limit=2000

                  header="**Updated $(date +%Y-%m-%d)** (${VERSION})"
                  subheader="Release notes:"

                  # Discord doesn't support reference-style links ([text][label] plus a
                  # separate "[label]: url" line), so those are converted to inline links.
                  # It also embeds link previews unless the URL is wrapped: [text](<url>).
                  discord_body=$(python3 - <<'PY'
                  import os
                  import re

                  text = os.environ["CHANGELOG_CONTENT"]

                  # Collect and remove reference definitions: [label]: url "optional title"
                  definitions = {}
                  definition_re = re.compile(
                      r"""^ {0,3}\[([^\]]+)\]:[ \t]*<?(\S+?)>?(?:[ \t]+(?:"[^"]*"|'[^']*'|\([^)]*\)))?[ \t]*$\n?""",
                      re.M,
                  )


                  def take_definition(m):
                      definitions[m.group(1).lower()] = m.group(2)
                      return ""


                  text = definition_re.sub(take_definition, text).rstrip("\n")


                  def inline(label, url):
                      return f"[{label}](<{url}>)"


                  def full_reference(m):
                      label = m.group(2) or m.group(1)
                      url = definitions.get(label.lower())
                      return inline(m.group(1), url) if url else m.group(0)


                  def shortcut_reference(m):
                      url = definitions.get(m.group(1).lower())
                      return inline(m.group(1), url) if url else m.group(0)


                  # [text][label] and [text][]
                  text = re.sub(r"\[([^\]]+)\]\[([^\]]*)\]", full_reference, text)
                  # [label]
                  text = re.sub(r"\[([^\]]+)\](?![\[(:])", shortcut_reference, text)
                  # Inline links
                  text = re.sub(r"\]\((https?:[^)>\s]+)\)", r"](<\1>)", text)
                  text = re.sub(r"^### (.*)$", r"**\1**", text, flags=re.M)

                  print(text)
                  PY
                  )
                  mapfile -t body_lines <<< "$discord_body"

                  all_lines=("$header" "$subheader" "")
                  all_lines+=("${body_lines[@]}")

                  chunk=""
                  first_chunk=true

                  flush() {
                    if [ "$first_chunk" = true ]; then
                      first_chunk=false
                    else
                      echo
                      echo "---"
                      echo
                    fi
                    echo "$chunk"
                  }

                  {
                    for line in "${all_lines[@]}"; do
                      if [ -z "$chunk" ]; then
                        candidate="$line"
                      else
                        candidate="$chunk"$'\n'"$line"
                      fi
                      if [ "${#candidate}" -gt "$discord_limit" ] && [ -n "$chunk" ]; then
                        flush
                        chunk="$line"
                      else
                        chunk="$candidate"
                      fi
                    done

                    if [ -n "$chunk" ]; then
                      flush
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Check for Published File ID
              if: ${{ inputs.upload_to_steam }}
              id: published_file_id_check
              shell: bash
              run: |
                  if [ -f "${{ steps.variables.outputs.mod_path }}/About/PublishedFileId.txt" ]; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::No PublishedFileId.txt found; skipping Steam Workshop upload. This is expected before the mod has been published to Steam for the first time."
                  fi

            - name: Check Steam Credentials Are Set
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              env:
                  STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
                  STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
                  STEAM_TFASEED: ${{ secrets.STEAM_TFASEED }}
              run: |
                  missing=()
                  [ -z "$STEAM_USERNAME" ] && missing+=("STEAM_USERNAME")
                  [ -z "$STEAM_PASSWORD" ] && missing+=("STEAM_PASSWORD")
                  [ -z "$STEAM_TFASEED" ] && missing+=("STEAM_TFASEED")

                  if [ "${#missing[@]}" -gt 0 ]; then
                    echo "::error::Missing required secret(s) for Steam Workshop upload: ${missing[*]}"
                    exit 1
                  fi

            - name: Prepare Changelog for Steam
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              id: steam_changelog
              shell: bash
              env:
                  CHANGELOG_CONTENT: ${{ steps.changelog_reader.outputs.changes }}
              run: |
                  # steamdown turns inline code into a block-level [code] element, which
                  # breaks the surrounding sentence onto separate lines on Steam. Steam has
                  # no inline code, so it's emitted as [b]...[/b] instead, which steamdown
                  # passes through as text. Markdown punctuation inside is backslash-escaped
                  # so steamdown keeps it literal instead of parsing it (e.g. __result) or
                  # autolinking it (e.g. http://localhost).
                  prepared=$(python3 - <<'PY'
                  import os
                  import re

                  text = os.environ["CHANGELOG_CONTENT"]


                  def bold(m):
                      escaped = re.sub(r"([\\`*_{}\[\]()#+\-.!|~<>:@])", r"\\\1", m.group(2))
                      return f"[b]{escaped}[/b]"


                  text = re.sub(r"(?<!`)(`+)(?!`)(.+?)(?<!`)\1(?!`)", bold, text)
                  print(text)
                  PY
                  )

                  delimiter="STEAM_CHANGELOG_$(openssl rand -hex 8)"
                  {
                    echo "markdown<<$delimiter"
                    echo "$prepared"
                    echo "$delimiter"
                  } >> "$GITHUB_OUTPUT"

            - name: Converts Markdown to Steam markup
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              id: markdown_steam
              uses: ilyvion/steamdown@main
              with:
                  markdown: ${{ steps.steam_changelog.outputs.markdown }}

            # Drops the indentation steamdown puts before each [*], to attempt to reduce the
            # count toward the 8000-byte change note limit.
            - name: Strip List Item Indentation from Steam Markup
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              id: steam_markup
              shell: bash
              env:
                  STEAM_MARKUP: ${{ steps.markdown_steam.outputs.steam-markup }}
              run: |
                  stripped=$(printf '%s\n' "$STEAM_MARKUP" | sed 's/^[[:space:]]\+\[\*\]/[*]/')

                  delimiter="STEAM_MARKUP_$(openssl rand -hex 8)"
                  {
                    echo "markup<<$delimiter"
                    echo "$stripped"
                    echo "$delimiter"
                  } >> "$GITHUB_OUTPUT"

            - name: Fail if Steam markup contains a double quote
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              env:
                  STEAM_MARKUP: ${{ steps.steam_markup.outputs.markup }}
              run: |
                  if [[ "$STEAM_MARKUP" == *\"* ]]; then
                    echo "Changelog contains a double quote, which would cause the Steam upload to fail."
                    exit 1
                  fi

            - name: Create Release
              if: ${{ inputs.create_release }}
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG_NAME: ${{ steps.variables.outputs.version }}
                  RELEASE_NOTES: ${{ steps.changelog_reader.outputs.changes }}
                  ASSET_PATH: ${{ steps.variables.outputs.mod_path }}.zip
                  ASSET_NAME: ${{ inputs.mod_name }}-${{ steps.variables.outputs.version }}.zip
              run: |
                  asset_dir=$(mktemp -d)
                  cp "$ASSET_PATH" "$asset_dir/$ASSET_NAME"
                  gh release create "$TAG_NAME" "$asset_dir/$ASSET_NAME" \
                    --repo "${{ github.repository }}" \
                    --verify-tag \
                    --title "Release $TAG_NAME" \
                    --notes "$RELEASE_NOTES"

            - name: Get Mod Item ID
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              id: mod_item_id
              run: |
                  itemid=$(<"${{ steps.variables.outputs.mod_path }}/About/PublishedFileId.txt")
                  echo "itemid=$itemid" >> "$GITHUB_OUTPUT"

            - name: Upload to Steam Workshop
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              uses: ZehMatt/steam-workshop-upload@569de82c2fdf3042af8491379fb698829ba63a9d
              with:
                  appid: 294100 # RimWorld
                  itemid: ${{ steps.mod_item_id.outputs.itemid }}
                  path: ${{ steps.variables.outputs.mod_path }}
                  changenote: ${{ steps.steam_markup.outputs.markup }}
              env:
                  STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
                  STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
                  STEAM_TFASEED: ${{ secrets.STEAM_TFASEED }}

            - name: Checkout rimworld-utils Repository
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              uses: actions/checkout@v7
              with:
                  repository: "ilyvion/rimworld-utils"
                  path: "rimworld-utils"
                  sparse-checkout: steam_workshop_update.py
                  sparse-checkout-cone-mode: false

            # The upload action can't set Workshop tags or the description, so they are updated separately
            - name: Update Steam Workshop Tags and Description
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              shell: bash
              env:
                  STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
                  STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
                  STEAM_TFASEED: ${{ secrets.STEAM_TFASEED }}
                  ITEM_ID: ${{ steps.mod_item_id.outputs.itemid }}
                  ABOUT_XML: ${{ steps.variables.outputs.mod_path }}/About/About.xml
                  DESCRIPTION_CHANGED: ${{ steps.steam_description.outputs.changed }}
              run: |
                  args=("$ITEM_ID" --versions-from "$ABOUT_XML")
                  if [ "$DESCRIPTION_CHANGED" = "true" ]; then
                    args+=(--description-from SteamDescription.txt)
                  fi
                  pipx run rimworld-utils/steam_workshop_update.py "${args[@]}"
