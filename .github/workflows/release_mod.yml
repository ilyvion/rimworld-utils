name: Release Mod Workflow
description: >
    This workflow builds a RimWorld mod and prepares it for release, including creating a
    GitHub release and uploading the mod to the Steam Workshop.

on:
    workflow_call:
        inputs:
            artifact_name:
                type: "string"
                description: "Name of the artifact uploaded in the build step"
                required: true
            mod_name:
                type: "string"
                description: "Name of the mod (used for solution and artifact names)"
                required: true
            rw_versions:
                type: "string"
                description: "Deprecated and ignored; the supported versions are read from About/About.xml's <supportedVersions>"
                required: false
            solution_configuration:
                type: "string"
                description: "Solution configuration to build"
                default: "Release"
                required: false
            create_release:
                type: "boolean"
                description: "Whether to create a GitHub release"
                default: true
                required: false
            upload_to_steam:
                type: "boolean"
                description: "Whether to upload the mod to Steam Workshop"
                default: true
                required: false
            steam_session_repo:
                type: "string"
                description: "Private repository (owner/name) the encrypted Steam login sessions are kept in, so releases reuse them instead of authorizing a new device; written with the STEAM_SESSION_TOKEN secret"
                default: "ilyvion/steam-session"
                required: false
            announcement_role_id:
                type: "string"
                description: "ID of the Discord role to ping in the release announcement; empty pings no role"
                default: "1272782840941117453"
                required: false

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Warn About Deprecated rw_versions Input
              if: ${{ inputs.rw_versions != '' }}
              shell: bash
              run: echo "::warning title=Deprecated Input::The rw_versions input is deprecated and ignored; the supported versions are read from About/About.xml's <supportedVersions>. Remove rw_versions from the calling workflow."

            - name: Generate Variables
              id: variables
              shell: bash
              run: |
                  echo "mod_path=./${{ inputs.mod_name }}" >> $GITHUB_OUTPUT
                  echo "version=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
                  echo "no_prefix_version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

            - name: Checkout Repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Check Steam Description for Changes Since Last Release
              id: steam_description
              shell: bash
              env:
                  CURRENT_TAG: ${{ steps.variables.outputs.version }}
                  UPLOAD_TO_STEAM: ${{ inputs.upload_to_steam }}
              run: |
                  echo "changed=false" >> "$GITHUB_OUTPUT"

                  if [ ! -f "SteamDescription.txt" ]; then
                    echo "::warning file=SteamDescription.txt,title=Steam Description Missing::No SteamDescription.txt found in the repository root."
                    exit 0
                  fi

                  previous_tag=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)

                  # A first release counts as changed, since the Steam Workshop description may not match the file yet.
                  if [ -z "$previous_tag" ]; then
                    reason="this is the first release"
                  elif ! git diff --quiet "$previous_tag" "$CURRENT_TAG" -- SteamDescription.txt; then
                    reason="SteamDescription.txt has changed since the last release ($previous_tag)"
                  else
                    exit 0
                  fi

                  echo "changed=true" >> "$GITHUB_OUTPUT"
                  if [ "$UPLOAD_TO_STEAM" = "true" ]; then
                    echo "::notice file=SteamDescription.txt,title=Steam Description Changed::${reason^}. The Steam Workshop description will be updated after the upload."
                  else
                    echo "::notice file=SteamDescription.txt,title=Steam Description Changed::${reason^}. Remember to update the Steam Workshop description after this release."
                  fi

            - name: Check Steam Preview Image for Changes Since Last Release
              id: steam_preview
              shell: bash
              env:
                  CURRENT_TAG: ${{ steps.variables.outputs.version }}
                  UPLOAD_TO_STEAM: ${{ inputs.upload_to_steam }}
              run: |
                  echo "changed=false" >> "$GITHUB_OUTPUT"

                  if [ ! -f "About/Preview.png" ]; then
                    echo "::warning file=About/Preview.png,title=Steam Preview Image Missing::No About/Preview.png found in the repository."
                    exit 0
                  fi

                  previous_tag=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)

                  # A first release counts as changed, since the Steam Workshop preview image may not match the file yet.
                  if [ -z "$previous_tag" ]; then
                    reason="this is the first release"
                  elif ! git diff --quiet "$previous_tag" "$CURRENT_TAG" -- About/Preview.png; then
                    reason="About/Preview.png has changed since the last release ($previous_tag)"
                  else
                    exit 0
                  fi

                  echo "changed=true" >> "$GITHUB_OUTPUT"
                  if [ "$UPLOAD_TO_STEAM" = "true" ]; then
                    echo "::notice file=About/Preview.png,title=Steam Preview Image Changed::${reason^}. The Steam Workshop preview image will be updated by the upload."
                  else
                    echo "::notice file=About/Preview.png,title=Steam Preview Image Changed::${reason^}. Remember to update the Steam Workshop preview image after this release."
                  fi

            - name: Verify Release Tag Is Signed
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG_NAME: ${{ steps.variables.outputs.version }}
              run: |
                  ref_json=$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG_NAME")
                  object_type=$(echo "$ref_json" | jq -r '.object.type')
                  object_sha=$(echo "$ref_json" | jq -r '.object.sha')

                  if [ "$object_type" != "tag" ]; then
                    echo "::error::Tag '$TAG_NAME' is a lightweight tag (not annotated), so it cannot be signed. Releases must be created from a signed tag."
                    exit 1
                  fi

                  tag_json=$(gh api "repos/${{ github.repository }}/git/tags/$object_sha")
                  verified=$(echo "$tag_json" | jq -r '.verification.verified')

                  if [ "$verified" != "true" ]; then
                    reason=$(echo "$tag_json" | jq -r '.verification.reason')
                    echo "::error::Tag '$TAG_NAME' is not signed or its signature could not be verified (reason: $reason)."
                    exit 1
                  fi

                  echo "Tag '$TAG_NAME' signature verified."

            - name: Create Mod Folder
              shell: bash
              run: mkdir -p ${{ steps.variables.outputs.mod_path }}

            - name: Download Mod Artifacts from Build Step
              uses: actions/download-artifact@v8
              with:
                  name: ${{ inputs.artifact_name }}
                  path: ${{ steps.variables.outputs.mod_path }}

            # We do this step to avoid a "zip bomb" as the zip from the build step
            # has the mod files at the root level, which is not what users generally want.
            - name: Zip Mod
              shell: bash
              run: zip -r ${{ steps.variables.outputs.mod_path }}.zip ${{ steps.variables.outputs.mod_path }}/*

            - name: Checkout rimworld-utils Repository
              uses: actions/checkout@v7
              with:
                  repository: "ilyvion/rimworld-utils"
                  path: "rimworld-utils"
                  sparse-checkout: |
                      discord_release_notes.sh
                      steam_guard.py
                      steam_session.sh
                      steam_workshop_update.py
                  sparse-checkout-cone-mode: false

            - name: Get Changelog Entry
              id: changelog_reader
              uses: mindsers/changelog-reader-action@v2
              with:
                  version: ${{ steps.variables.outputs.no_prefix_version }}
                  path: ${{ steps.variables.outputs.mod_path }}/CHANGELOG.md

            - name: Add Release Notes to Job Summary
              shell: bash
              env:
                  CHANGELOG_CONTENT: ${{ steps.changelog_reader.outputs.changes }}
                  VERSION: ${{ steps.variables.outputs.version }}
              run: bash rimworld-utils/discord_release_notes.sh >> "$GITHUB_STEP_SUMMARY"

            - name: Check for Published File ID
              if: ${{ inputs.upload_to_steam }}
              id: published_file_id_check
              shell: bash
              run: |
                  if [ -f "${{ steps.variables.outputs.mod_path }}/About/PublishedFileId.txt" ]; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::No PublishedFileId.txt found; skipping Steam Workshop upload. This is expected before the mod has been published to Steam for the first time."
                  fi

            - name: Check Steam Credentials Are Set
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              env:
                  STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
                  STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
                  STEAM_TFASEED: ${{ secrets.STEAM_TFASEED }}
              run: |
                  missing=()
                  [ -z "$STEAM_USERNAME" ] && missing+=("STEAM_USERNAME")
                  [ -z "$STEAM_PASSWORD" ] && missing+=("STEAM_PASSWORD")
                  [ -z "$STEAM_TFASEED" ] && missing+=("STEAM_TFASEED")

                  if [ "${#missing[@]}" -gt 0 ]; then
                    echo "::error::Missing required secret(s) for Steam Workshop upload: ${missing[*]}"
                    exit 1
                  fi

            - name: Prepare Changelog for Steam
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              id: steam_changelog
              shell: bash
              env:
                  CHANGELOG_CONTENT: ${{ steps.changelog_reader.outputs.changes }}
              run: |
                  # steamdown turns inline code into a block-level [code] element, which
                  # breaks the surrounding sentence onto separate lines on Steam. Steam has
                  # no inline code, so it's emitted as [b]...[/b] instead, which steamdown
                  # passes through as text. Markdown punctuation inside is backslash-escaped
                  # so steamdown keeps it literal instead of parsing it (e.g. __result) or
                  # autolinking it (e.g. http://localhost).
                  prepared=$(python3 - <<'PY'
                  import os
                  import re

                  text = os.environ["CHANGELOG_CONTENT"]


                  def bold(m):
                      escaped = re.sub(r"([\\`*_{}\[\]()#+\-.!|~<>:@])", r"\\\1", m.group(2))
                      return f"[b]{escaped}[/b]"


                  text = re.sub(r"(?<!`)(`+)(?!`)(.+?)(?<!`)\1(?!`)", bold, text)
                  print(text)
                  PY
                  )

                  delimiter="STEAM_CHANGELOG_$(openssl rand -hex 8)"
                  {
                    echo "markdown<<$delimiter"
                    echo "$prepared"
                    echo "$delimiter"
                  } >> "$GITHUB_OUTPUT"

            - name: Converts Markdown to Steam markup
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              id: markdown_steam
              uses: ilyvion/steamdown@main
              with:
                  markdown: ${{ steps.steam_changelog.outputs.markdown }}

            # Drops the indentation steamdown puts before each [*], to attempt to reduce the
            # count toward the 8000-byte change note limit.
            - name: Strip List Item Indentation from Steam Markup
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              id: steam_markup
              shell: bash
              env:
                  STEAM_MARKUP: ${{ steps.markdown_steam.outputs.steam-markup }}
              run: |
                  stripped=$(printf '%s\n' "$STEAM_MARKUP" | sed 's/^[[:space:]]\+\[\*\]/[*]/')

                  delimiter="STEAM_MARKUP_$(openssl rand -hex 8)"
                  {
                    echo "markup<<$delimiter"
                    echo "$stripped"
                    echo "$delimiter"
                  } >> "$GITHUB_OUTPUT"

            - name: Fail if Steam markup contains a double quote
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              env:
                  STEAM_MARKUP: ${{ steps.steam_markup.outputs.markup }}
              run: |
                  if [[ "$STEAM_MARKUP" == *\"* ]]; then
                    echo "Changelog contains a double quote, which would cause the Steam upload to fail."
                    exit 1
                  fi

            - name: Create Release
              if: ${{ inputs.create_release }}
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG_NAME: ${{ steps.variables.outputs.version }}
                  RELEASE_NOTES: ${{ steps.changelog_reader.outputs.changes }}
                  ASSET_PATH: ${{ steps.variables.outputs.mod_path }}.zip
                  ASSET_NAME: ${{ inputs.mod_name }}-${{ steps.variables.outputs.version }}.zip
              run: |
                  asset_dir=$(mktemp -d)
                  cp "$ASSET_PATH" "$asset_dir/$ASSET_NAME"
                  gh release create "$TAG_NAME" "$asset_dir/$ASSET_NAME" \
                    --repo "${{ github.repository }}" \
                    --verify-tag \
                    --title "Release $TAG_NAME" \
                    --notes "$RELEASE_NOTES"

            - name: Get Mod Item ID
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              id: mod_item_id
              run: |
                  itemid=$(<"${{ steps.variables.outputs.mod_path }}/About/PublishedFileId.txt")
                  echo "itemid=$itemid" >> "$GITHUB_OUTPUT"

            # SteamCMD is a 32-bit program, and the runner has no 32-bit libraries
            - name: Install SteamCMD
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              shell: bash
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq --no-install-recommends lib32gcc-s1
                  steamcmd_dir="$RUNNER_TEMP/steamcmd"
                  mkdir -p "$steamcmd_dir"
                  curl -sSfL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C "$steamcmd_dir"
                  {
                    echo "STEAMCMD_DIR=$steamcmd_dir"
                    echo "STEAM_SCRIPT_SESSION=$RUNNER_TEMP/steam_workshop_update_session.json"
                    echo "STEAM_SESSION_STATE=$RUNNER_TEMP/steam_session_state"
                  } >> "$GITHUB_ENV"

            - name: Restore Steam Login Sessions
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              id: steam_session
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.STEAM_SESSION_TOKEN }}
                  STEAM_SESSION_REPO: ${{ inputs.steam_session_repo }}
                  STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
                  STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
                  STEAM_TFASEED: ${{ secrets.STEAM_TFASEED }}
              run: |
                  if [ -z "$GH_TOKEN" ]; then
                    echo "enabled=false" >> "$GITHUB_OUTPUT"
                    echo "::notice title=Steam Session::No STEAM_SESSION_TOKEN secret found, so Steam login sessions aren't kept between releases and each release authorizes a new device."
                    exit 0
                  fi
                  echo "enabled=true" >> "$GITHUB_OUTPUT"
                  bash rimworld-utils/steam_session.sh restore || echo "::warning title=Steam Session::Restoring the Steam login sessions failed; logging in with the credentials."

            - name: Upload to Steam Workshop
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              shell: bash
              env:
                  STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
                  STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
                  STEAM_TFASEED: ${{ secrets.STEAM_TFASEED }}
                  ITEM_ID: ${{ steps.mod_item_id.outputs.itemid }}
                  MOD_PATH: ${{ steps.variables.outputs.mod_path }}
                  CHANGENOTE: ${{ steps.steam_markup.outputs.markup }}
                  PREVIEW_CHANGED: ${{ steps.steam_preview.outputs.changed }}
              run: |
                  content_folder=$(realpath "$MOD_PATH")
                  vdf="$RUNNER_TEMP/workshop_item.vdf"
                  {
                    echo '"workshopitem"'
                    echo '{'
                    echo '  "appid" "294100"'
                    echo "  \"publishedfileid\" \"$ITEM_ID\""
                    echo "  \"contentfolder\" \"$content_folder\""
                    if [ "$PREVIEW_CHANGED" = "true" ]; then
                      echo "  \"previewfile\" \"$content_folder/About/Preview.png\""
                    fi
                    echo "  \"changenote\" \"$CHANGENOTE\""
                    echo '}'
                  } > "$vdf"
                  cat "$vdf"

                  output="$RUNNER_TEMP/steamcmd_output.txt"
                  steamcmd() {
                    "$STEAMCMD_DIR/steamcmd.sh" +@ShutdownOnFailedCommand 1 +@NoPromptForPassword 1 \
                      +login "$@" +workshop_build_item "$vdf" +quit 2>&1 | tee "$output"
                  }

                  uploaded=false
                  credential_login=true
                  if grep -qs '"ConnectCache"' "$HOME/Steam/config/config.vdf"; then
                    echo "Logging in with SteamCMD's stored session."
                    if steamcmd "$STEAM_USERNAME"; then
                      uploaded=true
                    elif sed 's/\x1b\[[0-9;]*m//g' "$output" | grep -q "^Logging in user .* to Steam Public\.\.\.OK"; then
                      echo "::error::SteamCMD logged in with the stored session, but the upload failed."
                      credential_login=false
                    else
                      echo "::warning title=Steam Session::SteamCMD couldn't log in with the stored session; logging in with the credentials."
                    fi
                  fi

                  if [ "$uploaded" = false ] && [ "$credential_login" = true ]; then
                    guard_code=$(python3 rimworld-utils/steam_guard.py)
                    echo "::add-mask::$guard_code"
                    if steamcmd "$STEAM_USERNAME" "$STEAM_PASSWORD" "$guard_code"; then
                      uploaded=true
                    fi
                  fi

                  if [ "$uploaded" = false ]; then
                    for log in "$HOME"/Steam/logs/{stderr,workshop_log}.txt "$STEAMCMD_DIR"/logs/{stderr,workshop_log}.txt; do
                      if [ -f "$log" ]; then
                        echo "::group::$log"
                        cat "$log"
                        echo "::endgroup::"
                      fi
                    done
                    exit 1
                  fi

            # SteamCMD can't set Workshop tags, so they are updated separately, along with the description
            - name: Update Steam Workshop Tags and Description
              if: ${{ inputs.upload_to_steam && steps.published_file_id_check.outputs.exists == 'true' }}
              shell: bash
              env:
                  STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
                  STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
                  STEAM_TFASEED: ${{ secrets.STEAM_TFASEED }}
                  ITEM_ID: ${{ steps.mod_item_id.outputs.itemid }}
                  ABOUT_XML: ${{ steps.variables.outputs.mod_path }}/About/About.xml
                  DESCRIPTION_CHANGED: ${{ steps.steam_description.outputs.changed }}
              run: |
                  args=("$ITEM_ID" --versions-from "$ABOUT_XML" --session-file "$STEAM_SCRIPT_SESSION")
                  if [ "$DESCRIPTION_CHANGED" = "true" ]; then
                    args+=(--description-from SteamDescription.txt)
                  fi
                  pipx run rimworld-utils/steam_workshop_update.py "${args[@]}"

            - name: Save Steam Login Sessions
              if: ${{ always() && steps.steam_session.outputs.enabled == 'true' }}
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.STEAM_SESSION_TOKEN }}
                  STEAM_SESSION_REPO: ${{ inputs.steam_session_repo }}
                  STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
                  STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
                  STEAM_TFASEED: ${{ secrets.STEAM_TFASEED }}
              run: bash rimworld-utils/steam_session.sh save || echo "::warning title=Steam Session::Saving the Steam login sessions failed; the next release may authorize a new device."

            - name: Post Release Notes to Discord
              if: ${{ inputs.create_release }}
              shell: bash
              env:
                  DISCORD_WEBHOOK_URL: ${{ secrets.ANNOUNCEMENTS_WEBHOOK }}
                  CHANGELOG_CONTENT: ${{ steps.changelog_reader.outputs.changes }}
                  VERSION: ${{ steps.variables.outputs.version }}
                  ABOUT_XML: ${{ steps.variables.outputs.mod_path }}/About/About.xml
                  ROLE_ID: ${{ inputs.announcement_role_id }}
              run: |
                  if [ -z "$DISCORD_WEBHOOK_URL" ]; then
                    echo "::notice::No ANNOUNCEMENTS_WEBHOOK secret found; skipping the Discord announcement."
                    exit 0
                  fi

                  display_name=$(python3 -c 'import sys, xml.etree.ElementTree as ET; print(ET.parse(sys.argv[1]).findtext("name"))' "$ABOUT_XML")
                  args=(--post --title "$display_name Updated")
                  if [ -n "$ROLE_ID" ]; then
                    args+=(--pre-header "<@&$ROLE_ID>")
                  fi
                  bash rimworld-utils/discord_release_notes.sh "${args[@]}"
